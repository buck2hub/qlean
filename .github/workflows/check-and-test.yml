on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'

name: Check and Test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    strategy:
      fail-fast: false

    name: Setup and Cache
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy rustfmt
          cache-workspaces: .
          cache-directories: ./target

  format:
    name: Rustfmt Check
    runs-on: ubuntu-latest
    needs: setup
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Run rustfmt
        run: cargo fmt --check

  clippy:
    strategy:
        fail-fast: true
        
    name: Clippy Check
    runs-on: ubuntu-latest
    needs: setup
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy rustfmt
          cache-workspaces: .
          cache-directories: ./target

      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check rustdoc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Cargo Test
    runs-on: ubuntu-latest
    needs: setup
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy rustfmt
          cache-workspaces: .
          cache-directories: ./target

      - name: Run unit tests
        run: cargo test --lib

      # tests/windows_machine.rs holds the seven Windows smoke checks (each #[ignore]d:
      # they need a licensed qcow2 and a KVM host) next to the argument parsers those
      # checks assert through. Running the target executes the parsers and skips the
      # ignored checks; compiling it does neither, so the parsers went unexecuted here.
      - name: Run the integration tests that need no guest
        run: cargo test --test windows_machine

      # The ignored Windows checks above still have to compile: they are the ones no
      # runner here can execute.
      - name: Compile all targets
        run: cargo test --no-run --all-targets
